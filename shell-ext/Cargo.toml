[package]
name = "track-shell"
version = "0.1.0"
description = "Track's Explorer command: \"Open in Track\" in the Windows 11 context menu."
edition = "2021"

[lib]
name = "track_shell"
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
] }
